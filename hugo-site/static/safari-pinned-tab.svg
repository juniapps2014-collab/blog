<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Safari 핀 탭 마스크: 배경 없이 단색(검정)만 사용한다. 색은 mask-icon 링크에서 지정된다.
       파비콘 디자인(숫자 1 + 펼친 책)을 단색 실루엣으로 옮긴 것.
       16px에서도 형태가 뭉개지지 않도록 책은 두 면을 벌려 V자 홈을 남긴다. -->
  <g fill="#000000">
    <!-- 숫자 1 (받침 없는 형태 — 작은 크기에서 책과 붙지 않게) -->
    <path d="M18.4 4 18.4 18.4 15 18.4 15 8.9 11.9 10.6 11.9 7.2Z"/>
    <!-- 펼친 책 — 왼쪽 면 -->
    <path d="M2 21 14.4 23.2 14.4 29.4 2 27.2Z"/>
    <!-- 펼친 책 — 오른쪽 면 -->
    <path d="M30 21 17.6 23.2 17.6 29.4 30 27.2Z"/>
  </g>
</svg>
