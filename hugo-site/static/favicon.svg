<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#1a1a2e"/>
  <!-- Book spine -->
  <rect x="14" y="6" width="2.5" height="20" rx="1" fill="#e8d5b7"/>
  <!-- Left page -->
  <rect x="6" y="7" width="8" height="18" rx="2" fill="none" stroke="#e8d5b7" stroke-width="1.6"/>
  <!-- Right page -->
  <rect x="16.5" y="7" width="8" height="18" rx="2" fill="none" stroke="#e8d5b7" stroke-width="1.6"/>
  <!-- Left lines -->
  <line x1="8.5" y1="12" x2="12.5" y2="12" stroke="#e8d5b7" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
  <line x1="8.5" y1="15" x2="12.5" y2="15" stroke="#e8d5b7" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
  <line x1="8.5" y1="18" x2="12.5" y2="18" stroke="#e8d5b7" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
  <!-- Right lines -->
  <line x1="18.5" y1="12" x2="22.5" y2="12" stroke="#e8d5b7" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
  <line x1="18.5" y1="15" x2="22.5" y2="15" stroke="#e8d5b7" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
  <line x1="18.5" y1="18" x2="22.5" y2="18" stroke="#e8d5b7" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
</svg>
